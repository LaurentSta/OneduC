services:
  database:
    image: postgres:17.7-alpine
    container_name: hedgedoc-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: hedgedoc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: hedgedoc
    volumes:
      - hedgedoc_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hedgedoc -d hedgedoc"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    image: ${HEDGEDOC_IMAGE}
    container_name: hedgedoc-app
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      CMD_DB_URL: postgres://hedgedoc:${POSTGRES_PASSWORD}@database:5432/hedgedoc
      CMD_DOMAIN: ${HEDGEDOC_DOMAIN}
      CMD_PROTOCOL_USESSL: ${HEDGEDOC_PROTOCOL_USESSL}
      CMD_URL_ADDPORT: ${HEDGEDOC_URL_ADDPORT}
      CMD_ALLOW_FREEURL: ${HEDGEDOC_ALLOW_FREEURL}
      CMD_ALLOW_ANONYMOUS: ${HEDGEDOC_ALLOW_ANONYMOUS}
      CMD_LOGLEVEL: info
      UPLOADS_MODE: "0755"
    ports:
      - "${HEDGEDOC_PORT}:3000"
    volumes:
      - hedgedoc_uploads:/hedgedoc/public/uploads

volumes:
  hedgedoc_database:
  hedgedoc_uploads:
